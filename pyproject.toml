[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fits-hdu-map"
version = "0.1.1"
description = "Map FITS primary/IMAGE header, data and padding byte ranges without loading arrays."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
fits-hdu-map = "fits_hdu_map:main"
[tool.setuptools]
py-modules = ["fits_hdu_map"]
